# Переменные подставляются из файла `.env` в каталоге проекта (см. `.env.example`).
services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-yookassa}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-http://localhost:3000/payment/success}
      PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL:-}
      ROBOKASSA_MERCHANT_LOGIN: ${ROBOKASSA_MERCHANT_LOGIN:-}
      ROBOKASSA_PASSWORD_1: ${ROBOKASSA_PASSWORD_1:-}
      ROBOKASSA_PASSWORD_2: ${ROBOKASSA_PASSWORD_2:-}
      ROBOKASSA_IS_TEST: ${ROBOKASSA_IS_TEST:-false}
      ROBOKASSA_HASH_ALGORITHM: ${ROBOKASSA_HASH_ALGORITHM:-md5}
      ROBOKASSA_RECEIPT_ITEM_TAX: ${ROBOKASSA_RECEIPT_ITEM_TAX:-vat20}
      ROBOKASSA_SNO: ${ROBOKASSA_SNO:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ORDERS_CHAT_ID: ${TELEGRAM_ORDERS_CHAT_ID:-}
      INN: ${INN:-}
    restart: unless-stopped
